# Settings for the development tools (the app itself needs none of this).
#   python -m pytest                 all checks (tests/)
#   python -m pytest --cov           ... and which code they cover
#   ruff check .                     style and likely bugs
#   python tools/check.py            the quick check run before each commit (python tools/install_hooks.py)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["fpv3d"]
omit = ["fpv3d/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
line-length = 150
target-version = "py39"
extend-include = ["*.pyw"]
exclude = [".venv", "build", "dist", "cache", "scenes"]

[tool.ruff.lint]
# E/W style, F real mistakes (unused, undefined), B likely bugs
select = ["E", "W", "F", "B"]
# E701/E702: short `a; b` lines are part of this code's compact style. E741: `l` is used for "location".
# B905: zip(strict=) needs Python 3.10, the code supports 3.9.
# E731: one-line lambdas for tiny helpers are fine here.
ignore = ["E701", "E702", "E741", "E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"launcher.pyw" = ["E501"]     # the PowerShell network check is kept as one readable block

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["fpv3d/geo.py", "fpv3d/radio.py", "fpv3d/crsf.py", "fpv3d/launcher_tiles.py", "fpv3d/paths.py",
         "fpv3d/safefile.py", "fpv3d/errorlog.py", "fpv3d/deps.py", "fpv3d/housekeeping.py", "fpv3d/battery.py", "fpv3d/config.py"]
