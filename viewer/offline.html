<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090c">
<title>Alpline</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--t-bg, #07090c); color: var(--t-fg, #f2f5f8); font: 14px/1.5 ui-monospace, Consolas, monospace; padding: 24px; text-align: center; box-sizing: border-box; }
  h1 { font-size: 22px; letter-spacing: .14em; margin: 8px 0 0; }
  p { color: #8b96a8; max-width: 420px; margin: 4px 0; }
  button { font: inherit; margin-top: 14px; padding: 8px 16px; background: transparent; color: inherit; border: 1px solid #8b96a8; cursor: pointer; }
</style>
</head>
<body>
<span id="d"></span>
<h1>ALPLINE</h1>
<p><b>Can't reach the computer.</b></p>
<p>Alpline runs on your computer: start it there (launcher → phone sharing on), keep the phone on the same Wi-Fi or the laptop on the phone's hotspot, then try again.</p>
<button onclick="location.href='/viewer/?app=1'">[try again]</button>
<script type="module">
  import { mountDrone } from './drone.js';
  mountDrone(document.getElementById('d'), { size: 110 }).loop('hover');
</script>
</body>
</html>
